                    <div>
                      <label className="block text-slate-300 font-bold mb-1">{lang === 'ar' ? 'الفرع' : 'Branch'}</label>
                      <select
                        value={newPatBranch}
                        onChange={e => setNewPatBranch(e.target.value)}
                        className="w-full p-3 rounded-xl bg-slate-900 border border-white/20 text-white font-bold"
                      >
                        <option value="القاهرة (التجمع)">القاهرة (التجمع الخامس)</option>
                        <option value="المنصورة">المنصورة</option>
                        <option value="دمياط">دمياط</option>
                        <option value="بورسعيد">بورسعيد</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-slate-300 font-bold mb-1">{lang === 'ar' ? 'الإجراء الطبي' : 'Procedure'}</label>
                      <select
                        value={newPatReason}
                        onChange={e => setNewPatReason(e.target.value)}
                        className="w-full p-3 rounded-xl bg-slate-900 border border-white/20 text-white font-bold"
                      >
                        <option value="ICSI Protocol (حقن مجهري)">ICSI Protocol (حقن مجهري)</option>
                        <option value="IVF Cycle (أطفال أنابيب)">IVF Cycle (أطفال أنابيب)</option>
                        <option value="Antenatal Care (متابعة حمل)">Antenatal Care (متابعة حمل)</option>
                        <option value="Laparoscopy (منظار نسا)">Laparoscopy (منظار نسا)</option>
                      </select>
                    </div>
                  </div>

                  <button type="submit" className="w-full py-4 rounded-xl bg-[#00e599] hover:bg-[#00c985] text-slate-950 font-black text-sm shadow-xl transition">
                    {lang === 'ar' ? 'تأكيد وحفظ الموعد في التقويم' : 'Save Reservation to Calendar'}
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
